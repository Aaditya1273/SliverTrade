# =============================================================================
# SilverTrade AI — Dependabot Configuration
# =============================================================================
# Automatically creates PRs for dependency updates across all ecosystems.
# Minor and patch updates are grouped to reduce PR noise.
# =============================================================================

version: 2
updates:
  # ── Python (Platform backend) ──────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/Platfrom"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      flask:
        patterns:
          - "flask*"
          - "Flask*"
          - "Werkzeug"
        update-types:
          - "minor"
          - "patch"
      sqlalchemy:
        patterns:
          - "SQLAlchemy*"
          - "alembic*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
        update-types:
          - "minor"
          - "patch"
      security:
        patterns:
          - "cryptography*"
          - "bcrypt*"
          - "argon2*"
          - "PyJWT*"
          - "pyotp*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]

  # ── Python (Data Fetch) ────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/data_fetch"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # ── Python (Strategy Engine) ───────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/Trade_Strategies"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # ── npm (Root — for Tailwind CSS build) ────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "css"

  # ── npm (Next.js UI) ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      radix:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "vitest*"
          - "@testing-library/*"
          - "playwright*"
        update-types:
          - "minor"
          - "patch"

  # ── Docker (All services) ──────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/Platfrom"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/data_fetch"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/Trade_Strategies"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
