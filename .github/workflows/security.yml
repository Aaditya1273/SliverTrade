# =============================================================================
# SilverTrade AI — Weekly Security Audit
# =============================================================================
# Runs independently of CI to provide comprehensive security analysis with
# SARIF reports uploaded to GitHub Security tab.
#
# Triggers:
#   - Schedule: Every Monday at 2:30 AM IST
#   - Manual: workflow_dispatch from GitHub UI
# =============================================================================

name: SilverTrade AI Security Audit

on:
  schedule:
    - cron: "30 21 * * 0"  # Sunday 21:00 UTC = Monday 2:30 AM IST
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # SAST — Static Application Security Testing with Bandit
  # ===========================================================================
  sast-python:
    name: SAST — Python (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Platfrom
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Bandit SAST (full)
        run: |
          uv run bandit \
            -r . \
            -x .venv,node_modules,test,docs,examples,frontend \
            --severity-level low \
            --confidence-level low \
            --format sarif \
            --output bandit-results.sarif \
            || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./Platfrom/bandit-results.sarif
          category: bandit
          wait-for-processing: true

  # ===========================================================================
  # Dependency Audit — pip-audit for known vulnerabilities
  # ===========================================================================
  dependency-audit:
    name: Dependency Audit — pip-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - path: ./Platfrom
            name: platform
          - path: ./data_fetch
            name: data-fetch
          - path: ./Trade_Strategies
            name: strategy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (${{ matrix.service.name }})
        working-directory: ${{ matrix.service.path }}
        run: uv sync --group dev

      - name: pip-audit ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          uv run pip-audit \
            --strict \
            --desc on \
            --format json \
            --output pip-audit-${{ matrix.service.name }}.json \
            || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/pip-audit-${{ matrix.service.name }}.json
          retention-days: 30

  # ===========================================================================
  # Secrets Scan — detect-secrets for credential leaks
  # ===========================================================================
  secrets-scan:
    name: Secrets Scan — detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install detect-secrets>=1.5.0

      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.venv|node_modules|__pycache__|\.git' \
            --exclude-lines '^\s*#|^\s*$|sample|example|test|placeholder|noop|localhost' \
            --all-files \
            > secrets-report.json || true

      - name: Check for high-confidence secrets
        run: |
          HIGH_CONF=$(python3 -c "
          import json
          with open('secrets-report.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', {}).get('', [])
                  if r.get('is_secret', False)]
          print(f'High-confidence secrets found: {len(high)}')
          for r in high:
              print(f'  - {r.get(\"filename\")}:{r.get(\"line_number\")} ({r.get(\"type\", \"unknown\")})')
          ")
          echo "$HIGH_CONF"

      - name: Upload secrets report
        uses: actions/upload-artifact@v4
        with:
          name: secrets-report
          path: secrets-report.json
          retention-days: 30

  # ===========================================================================
  # npm Audit — Frontend dependency scan
  # ===========================================================================
  npm-audit:
    name: npm Audit — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: |
          npm audit --audit-level=high || true

      - name: npm audit JSON report
        run: |
          npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: ./ui/npm-audit-report.json
          retention-days: 30

  # ===========================================================================
  # Summary — Generate consolidated security report
  # ===========================================================================
  security-summary:
    name: Security Summary
    needs: [sast-python, dependency-audit, secrets-scan, npm-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check conclusion status
        run: |
          echo "## Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Bandit) | ${{ needs.sast-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency (Platform) | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency (Data Fetch) | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency (Strategy) | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts (retained 30 days):" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit SARIF report (uploaded to Security tab)" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit reports (all services)" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan report" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit report" >> $GITHUB_STEP_SUMMARY
