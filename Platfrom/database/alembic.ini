# ── SilverTrade AI Alembic Configuration ─────────────────────────
# Manages database schema migrations for all 5 database connections.
# 
# Usage:
#   alembic -c database/alembic.ini init migrations
#   alembic -c database/alembic.ini revision --autogenerate -m "add_user_preferences"
#   alembic -c database/alembic.ini upgrade head

[alembic]
# Path to migration scripts
script_location = database/migrations

# Template for migration messages
# sqlalchemy.url is configured per-database below

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
