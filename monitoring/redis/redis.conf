# =============================================================================
# SilverTrade AI — Redis Configuration (Phase 9)
# =============================================================================
# Production Redis configuration for sessions, caching, and rate limiting
# =============================================================================

# Bind to localhost only for security
bind 127.0.0.1

# Port
port 6379

# Require password
requirepass ${REDIS_PASSWORD}

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Number of databases
databases 16

# Timeout
timeout 300

# TCP keepalive
tcp-keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
