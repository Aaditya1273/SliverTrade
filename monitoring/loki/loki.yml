# =============================================================================
# SilverTrade AI — Loki Configuration (Staging / Production)
# =============================================================================
# Minimal Loki config using filesystem storage. In production, consider
# switching to S3/GCS for durability and scalability.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 5
  ingestion_burst_size_mb: 10
  max_global_streams_per_user: 1000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
