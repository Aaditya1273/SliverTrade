# =============================================================================
# SilverTrade AI — Grafana Dashboard Provisioning
# =============================================================================
# Automatically loads all dashboard JSON files from the dashboards/ directory
# on Grafana startup.
# =============================================================================

apiVersion: 1

providers:
  - name: 'SilverTrade AI Dashboards'
    orgId: 1
    folder: 'SilverTrade AI'
    folderUid: 'silvertrade'
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/silvertrade
