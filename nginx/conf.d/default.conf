# =============================================================================
# SilverTrade AI — Nginx Virtual Host Configuration
# =============================================================================
# Supports HTTP → HTTPS redirect, SSL termination, reverse proxy to all
# microservices, WebSocket proxying, and comprehensive security headers.
#
# Upstream server groups are defined in nginx.conf:
#   platform_backend     — Flask/Gunicorn on port 5000
#   ui_backend           — Next.js on port 3000
#   data_fetch_backend   — Data Fetch on port 5005
#   strategies_backend   — Strategy Engine on port 5007
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS Redirect (all traffic forced to SSL)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let Certbot write to this directory for domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS Server (SSL termination)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # ── SSL Certificate (managed by Certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/$host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$host/privkey.pem;

    # ── Modern TLS config (Mozilla Intermediate) ──────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ── Rate Limiting ────────────────────────────────────────────────
    limit_req zone=auth_limit burst=5 nodelay;
    limit_conn conn_limit 10;

    # ── Proxy Headers ────────────────────────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    # =================================================================
    # Route: Platform API (/api/*)
    # =================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://platform_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Route: Platform Auth (/auth/*)
    # =================================================================
    location /auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://platform_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Route: Data Fetch Service (/data-fetch/*)
    # =================================================================
    location /data-fetch/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/data-fetch/(.*) /$1 break;
        proxy_pass http://data_fetch_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Route: Strategy Engine (/strategies/*)
    # =================================================================
    location /strategies/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/strategies/(.*) /$1 break;
        proxy_pass http://strategies_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Route: Nginx stub_status (for Prometheus nginx metrics)
    # =================================================================
    location /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker internal network
        deny all;
    }

    # =================================================================
    # Route: Grafana Dashboard (/grafana/)
    # =================================================================
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    # =================================================================
    # Route: WebSocket (/ws) — long-lived persistent connection
    # =================================================================
    location /ws {
        proxy_pass http://platform_backend;
        proxy_read_timeout 86400s;
    }

    # =================================================================
    # Route: UI Dashboard (Next.js — served at /ui/)
    # =================================================================
    location /ui/ {
        rewrite ^/ui/(.*) /$1 break;
        proxy_pass http://ui_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Route: Platform Web UI (catch-all for Flask routes)
    # =================================================================
    location / {
        proxy_pass http://platform_backend;
        proxy_redirect off;
    }

    # =================================================================
    # Static asset caching
    # =================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://platform_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        expires 30d;
    }

    # =================================================================
    # Deny access to sensitive files
    # =================================================================
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /(db|log|keys)/ {
        deny all;
        return 404;
    }
}
