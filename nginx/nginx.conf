# =============================================================================
# SilverTrade AI — Nginx Main Configuration
# =============================================================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Rate limiting zones (shared across all workers)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=order_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=200r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream servers (internal Docker network)
upstream platform_backend {
    server platform:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream ui_backend {
    server ui:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream data_fetch_backend {
    server data_fetch:5005 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream strategies_backend {
    server trade_strategies:5007 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic Settings ─────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    client_body_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # ── Logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── SSL Session Cache ──────────────────────────────────────────────
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Include site configs ───────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
