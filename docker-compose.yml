services:
  # ----------------------------------------------------
  # 1. SilverTrade Platform (Main API Gateway)
  # ----------------------------------------------------
  platform:
    build:
      context: ./Platfrom
      dockerfile: Dockerfile
    container_name: platform
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - REDIRECT_URL=http://localhost:5000/zerodha/callback
      - DATA_FETCH_URL=http://data_fetch:5005
      - TRADE_STRATEGIES_URL=http://trade_strategies:5007
    volumes:
      - ./Platfrom:/app
      - ./Platfrom/database:/app/database
      - ./Platfrom/log:/app/log
      - ./Platfrom/.env:/app/.env
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. SilverTrade Data Fetch (Market Data Aggregation)
  # ----------------------------------------------------
  data_fetch:
    build:
      context: ./data_fetch
      dockerfile: Dockerfile
    container_name: data_fetch
    ports:
      - "5005:5005"
    environment:
      - SILVERTRADE_HOST=http://platform:5000
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5005
    volumes:
      - ./data_fetch:/app
      - ./data_fetch/.env:/app/.env
    depends_on:
      - platform
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. SilverTrade Strategy Engine (AI Decisions)
  # ----------------------------------------------------
  trade_strategies:
    build:
      context: ./Trade_Strategies
      dockerfile: Dockerfile
    container_name: trade_strategies
    ports:
      - "5007:5007"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5007
    volumes:
      - ./Trade_Strategies:/app
      - ./Trade_Strategies/.env:/app/.env
    restart: unless-stopped

  # ----------------------------------------------------
  # 4. SilverTrade UI (Next.js Dashboard)
  # ----------------------------------------------------
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - platform
    restart: unless-stopped
